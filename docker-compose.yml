

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    volumes:
      - .:/var/www/html
    networks:
      - laravel_net

  web:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel_net  # Fixed: was "laravel" but should match the network name

  db:
    image: mysql:8
    container_name: laravel_db
    environment:
      MYSQL_DATABASE: ringocrm
      MYSQL_USER: rico
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:  # Fixed: indentation was wrong
      - laravel_net

  redis:  # Fixed: indentation - this should be under services
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel_net

volumes:
  db_data:
  redis_data:

networks:
  laravel_net:
    driver: bridge  # Fixed: proper YAML structure for network configuration